apiVersion: v1
kind: Service
metadata:
  name: inbox2done-api
  namespace: inbox2done
  labels:
    app.kubernetes.io/name: inbox2done-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: inbox2done
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inbox2done-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox2done-api
  namespace: inbox2done
  labels:
    app.kubernetes.io/name: inbox2done-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: inbox2done
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: inbox2done-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbox2done-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: inbox2done
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-dependencies
          image: inbox2done-backend:k8s
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |

              import socket, time
              dependencies = (("postgres", 5432), ("redis", 6379))
              for host, port in dependencies:
                  deadline = time.monotonic() + 120
                  while time.monotonic() < deadline:
                      try:
                          with socket.create_connection((host, port), timeout=3):
                              break
                      except OSError:
                          time.sleep(2)
                  else:
                      raise SystemExit(f"{host}:{port} did not become reachable")
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: api
          image: inbox2done-backend:k8s
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: {name: inbox2done-config}
            - secretRef: {name: inbox2done-secrets}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: temporary-files
          emptyDir: {sizeLimit: 128Mi}
