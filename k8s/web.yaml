apiVersion: v1
kind: Service
metadata:
  name: inbox2done-web
  namespace: inbox2done
spec:
  selector:
    app.kubernetes.io/name: inbox2done-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox2done-web
  namespace: inbox2done
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inbox2done-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbox2done-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: inbox2done-web:k8s
          imagePullPolicy: IfNotPresent
          env:
            - name: API_UPSTREAM
              value: inbox2done-api:80
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /web-health, port: 8080}
          livenessProbe:
            httpGet: {path: /web-health, port: 8080}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
