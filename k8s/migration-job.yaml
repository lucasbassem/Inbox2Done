apiVersion: batch/v1
kind: Job
metadata:
  name: inbox2done-migrate
  namespace: inbox2done
  labels:
    app.kubernetes.io/name: inbox2done-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: inbox2done
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbox2done-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: inbox2done
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-postgres
          image: inbox2done-backend:k8s
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket, time
              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  try:
                      with socket.create_connection(("postgres", 5432), timeout=3):
                          raise SystemExit(0)
                  except OSError:
                      time.sleep(2)
              raise SystemExit("PostgreSQL did not become reachable")
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: migrate
          image: inbox2done-backend:k8s
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: inbox2done-config}
            - secretRef: {name: inbox2done-secrets}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
