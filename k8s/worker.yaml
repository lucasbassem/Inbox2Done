apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox2done-worker
  namespace: inbox2done
  labels:
    app.kubernetes.io/name: inbox2done-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: inbox2done

spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: inbox2done-worker
      app.kubernetes.io/component: worker

  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbox2done-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: inbox2done

    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-dependencies
          image: inbox2done-backend:k8s
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -c
            - |
              import socket
              import time

              dependencies = (
                  ("postgres", 5432),
                  ("redis", 6379),
              )

              for host, port in dependencies:
                  deadline = time.monotonic() + 120

                  while time.monotonic() < deadline:
                      try:
                          with socket.create_connection(
                              (host, port),
                              timeout=3,
                          ):
                              print(f"{host}:{port} is reachable")
                              break
                      except OSError:
                          time.sleep(2)
                  else:
                      raise SystemExit(
                          f"{host}:{port} did not become reachable"
                      )

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: worker
          image: inbox2done-backend:k8s
          imagePullPolicy: IfNotPresent

          command:
            - celery
            - -A
            - app.worker.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=2
            - --hostname=worker@%h

          envFrom:
            - configMapRef:
                name: inbox2done-config
            - secretRef:
                name: inbox2done-secrets

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  celery
                  -A app.worker.celery_app:celery_app
                  inspect ping
                  -d "worker@$(hostname)"
                  --timeout=10
                  | grep -q pong
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  celery
                  -A app.worker.celery_app:celery_app
                  inspect ping
                  -d "worker@$(hostname)"
                  --timeout=10
                  | grep -q pong
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  celery
                  -A app.worker.celery_app:celery_app
                  inspect ping
                  -d "worker@$(hostname)"
                  --timeout=10
                  | grep -q pong
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 256Mi